[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grant-intelligence-platform"
version = "1.0.0"
description = "Configurable IRS BMF ETL, funder prioritization, and nonprofit grant intelligence dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Grant Intelligence Platform Contributors"}]
keywords = ["nonprofit", "grants", "irs-bmf", "etl", "streamlit", "data-science"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Non-Profit",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<3.0",
  "plotly>=5.18,<7.0",
  "pyarrow>=14,<22",
  "PyYAML>=6.0,<7.0",
  "scikit-learn>=1.3,<2.0",
  "streamlit>=1.50,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.5,<1.0",
]

[project.scripts]
grant-intelligence = "grant_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
